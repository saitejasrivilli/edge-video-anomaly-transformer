# Phase 6 Video Transformer — default config.
# Loaded via evat.models.transformer.config.TransformerConfig.

feature_dim: 576          # must match the Phase 5 encoder's output dim (mobilenet_v3_small native)
d_model: 128
num_heads: 4
num_layers: 2
d_ff: 256
dropout: 0.1
max_sequence_length: 64   # must be >= configs/features.yaml temporal.sequence_length
num_classes: 2
positional_encoding: sinusoidal
pooling: masked_mean

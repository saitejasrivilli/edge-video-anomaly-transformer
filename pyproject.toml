[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evat"
version = "0.1.0"
description = "Edge Video Anomaly Transformer — research prototype for video segmentation, tracking, and anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sai Teja Srivilli Butturu" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evat"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["evat"]
mypy_path = "src"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
